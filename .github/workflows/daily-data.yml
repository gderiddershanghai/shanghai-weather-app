name: Daily data update

on:
  schedule:
    - cron: '30 23 * * *' # 07:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Fetch weather (Open-Meteo archive)
        run: uv run python -m pipeline.fetch.open_meteo

      - name: Fetch AQI (WAQI feed)
        if: env.WAQI_TOKEN != ''
        run: uv run python -m pipeline.fetch.aqi_feed
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: daily update $(date -u +%F)"
          git push

  # GITHUB_TOKEN pushes don't trigger `push` workflows — call deploy explicitly.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
