[project]
name = "shanghai-weather-pipeline"
version = "0.1.0"
description = "Build-time data pipeline for the Shanghai weather app"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
]

[tool.uv]
# pipeline is a flat module dir, not an installable package
package = false
